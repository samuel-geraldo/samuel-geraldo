<svg width="540" height="268" viewBox="0 0 540 268" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Samuel's Data Stats</title>
  <desc id="d">Ringkasan data yang dibersihkan dan dianalisis di seluruh project portofolio.</desc>
  <style>
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #70a5fd; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #787c99; }
    .label { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #38bdae; }
    .value { font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #c0caf5; }
    .hero { font: 700 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #70a5fd; }
    .cap { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #bf91f3; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="539" height="267" fill="#1a1b27" stroke="#70a5fd" stroke-opacity="0.35"/>
  <text x="25" y="36" class="title">Samuel's Data Stats</text>
  <text x="25" y="54" class="sub">All data projects combined</text>
  <text x="25" y="80" class="label">Data projects:</text>
  <text x="215" y="80" class="value">5</text>
  <text x="25" y="106" class="label">Rows processed:</text>
  <text x="215" y="106" class="value">1,086,625</text>
  <text x="25" y="132" class="label">Clean rows produced:</text>
  <text x="215" y="132" class="value">794,618</text>
  <text x="25" y="158" class="label">SQL queries:</text>
  <text x="215" y="158" class="value">17</text>
  <text x="25" y="184" class="label">Statistical tests:</text>
  <text x="215" y="184" class="value">10</text>
  <text x="25" y="210" class="label">Charts &amp; dashboards:</text>
  <text x="215" y="210" class="value">33</text>
  <text x="25" y="236" class="label">Bugs documented:</text>
  <text x="215" y="236" class="value">12</text>
  <text x="445" y="128" class="hero" text-anchor="middle">1.09M</text>
  <text x="445" y="150" class="cap" text-anchor="middle">rows processed</text>
  <text x="445" y="170" class="sub" text-anchor="middle">794,618 clean rows out</text>
</svg>
